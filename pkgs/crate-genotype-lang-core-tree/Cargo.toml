[package]
name = "genotype_lang_core_tree"
version = "0.19.0"
edition = "2024"
description = "Genotype language target crate"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/genotype"

[dependencies]
genotype_tree = { version = "0.19.0", path = "../crate-genotype-tree" }
miette = { version = "7.6.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1.0.64"
indexmap = { version = "2.6.0", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
insta = { version = "1.46.3", features = ["ron"] }
