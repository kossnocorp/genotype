[package]
name = "genotype_lang_py_config"
version = "0.16.1"
edition = "2024"
description = "Genotype language Python target config crate"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/genotype"

[dependencies]
genotype_core = { version = "0.16.1", path = "../crate-genotype-core" }
genotype_project_core = { version = "0.16.1", path = "../crate-genotype-project-core" }
serde = { version = "1.0.228", features = ["derive"] }
relative-path = { version = "1.9.3", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
insta = { version = "1.46.3", features = ["ron"] }
