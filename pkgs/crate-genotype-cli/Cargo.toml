[package]
name = "genotype_cli"
version = "0.16.2"
edition = "2024"
description = "Genotype language CLI"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/genotype"

[[bin]]
name = "gt"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/gt-v{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
genotype_backend = { version = "0.16.2", path = "../crate-genotype-backend" }
genotype_project_core = { version = "0.16.2", path = "../crate-genotype-project-core" }
genotype_project = { version = "0.16.2", path = "../crate-genotype-project" }
genotype_workspace = { version = "0.16.2", path = "../crate-genotype-workspace" }
genotype_lang_core_project = { version = "0.16.2", path = "../crate-genotype-lang-core-project" }
genotype_lang_ts_project = { version = "0.16.2", path = "../crate-genotype-lang-ts-project" }
genotype_lang_py_project = { version = "0.16.2", path = "../crate-genotype-lang-py-project" }
genotype_lang_py_tree = { version = "0.16.2", path = "../crate-genotype-lang-py-tree" }
genotype_lang_py_config = { version = "0.16.2", path = "../crate-genotype-lang-py-config" }
genotype_lang_rs_project = { version = "0.16.2", path = "../crate-genotype-lang-rs-project" }
genotype_lang_rs_config = { version = "0.16.2", path = "../crate-genotype-lang-rs-config" }
genotype_compiler = { version = "0.16.2", path = "../crate-genotype-compiler" }
relative-path = { version = "1.9.3", features = ["serde"] }
clap = { version = "4.5.19", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"] }
syntect = "5.3.0"
thiserror = "1.0.64"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
tui-checkbox = "0.4.6"
heck = "0.5.0"
toml = { version = "0.8.19", features = ["preserve_order"] }
semver = { version = "1.0.27", features = ["serde"] }
termbg = "0.6.2"
futures = "0.3.31"
glob = "0.3.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
insta = { version = "1.46.3", features = ["ron"] }
trybuild = "1.0.111"
serde = { version = "1.0.228", features = ["derive"] }
ordered-float = { version = "4", features = ["serde"] }
tempfile = "3.27.0"
