[tasks."gen/types"]
description = "Generates Genotype project types for TypeScript and Rust"
run = { task = "//:dev/gt", args = ["build", "pkgs/crate-genotype-project-core"] }

[tasks."gen/types:watch"]
description = "Generates Genotype project types for TypeScript and Rust in watch mode"
run = { task = "//:dev/gt:watch", args = [
  "pkgs/crate-genotype-project-core/types",
  "build",
  "pkgs/crate-genotype-project-core",
] }
