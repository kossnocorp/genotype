[package]
name = "genotype_lsp"
version = "0.18.0"
edition = "2024"
description = "Genotype language LSP server"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/genotype"

[dependencies]
genotype_parser = { version = "0.18.0", path = "../crate-genotype-parser" }
genotype_core = { version = "0.18.0", path = "../crate-genotype-core" }
genotype_project = { version = "0.18.0", path = "../crate-genotype-project" }
genotype_project_core = { version = "0.18.0", path = "../crate-genotype-project-core" }
serde = { version = "1.0", features = ["derive"] }
ignore = "0.4.25"
toml = "0.8.19"
async-lsp = { version = "0.2.3", features = ["tokio"] }
tokio = { version = "1.42.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["compat"] }
tower = "0.5.2"

[dev-dependencies]
tempfile = "3.27.0"
