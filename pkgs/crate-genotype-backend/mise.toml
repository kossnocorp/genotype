[tasks."gen/types"]
description = "Generates Genotype backend types for TypeScript and Rust"
run = { task = "//:dev/gt", args = ["build", "pkgs/crate-genotype-backend"] }

[tasks."gen/types:watch"]
description = "Generates Genotype backend types for TypeScript and Rust in watch mode"
run = { task = "//:dev/gt:watch", args = [
  "pkgs/crate-genotype-backend/types",
  "build",
  "pkgs/crate-genotype-backend",
] }
