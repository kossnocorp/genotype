[package]
name = "genotype_wasm"
version = "0.16.2"
edition = "2024"
description = "Genotype language Wasm crate"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/genotype"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
genotype_backend = { version = "0.16.2", path = "../crate-genotype-backend" }
genotype_project_core = { version = "0.16.2", path = "../crate-genotype-project-core" }
genotype_compiler = { version = "0.16.2", path = "../crate-genotype-compiler", default-features = false, features = [
  "wasm",
] }
futures = "0.3.31"
js-sys = "0.3.95"
miette = { version = "7.6.0", features = ["serde"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.45"
wasm-bindgen-test = "0.3.76"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
