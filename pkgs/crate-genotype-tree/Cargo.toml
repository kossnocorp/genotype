[package]
name = "genotype_tree"
version = "0.18.0"
edition = "2024"
description = "Genotype language AST crate"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/genotype"

[dependencies]
genotype_core = { version = "0.18.0", path = "../crate-genotype-core" }
miette = { version = "7.6.0", features = ["serde"] }
thiserror = "1.0.64"
serde = { version = "1.0.228", features = ["derive", "rc"] }
genotype_visitor_macro = { version = "0.18.0", path = "../crate-genotype-visitor-macro" }

[dev-dependencies]
pretty_assertions = "1.4.1"
insta = { version = "1.46.3", features = ["ron"] }
indoc = "2.0.7"

[features]
default = []
test = []
