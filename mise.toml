experimental_monorepo_root = true
[monorepo]
config_roots = ["pkgs/*"]

[tools]
# Stack

# Node.js
node = "lts"
"npm:pnpm" = "latest"

# Python
python = "3.14.4"
uv = "latest"
ty = "latest"
ruff = "latest"

# Tools
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
gh = "latest"
jaq = "latest"

[settings]
lockfile = true
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["rust"] # Use rust-toolchain.toml

[env]
_.file = "./.env"
_.python.venv = { create = true, path = '.venv' }
MISE_EXPERIMENTAL = true # Enable monorepo root support

# Tasks ########################################################################

[tasks.install]
depends = ["install/pnpm", "install/uv"]

[tasks."install/pnpm"]
run = "pnpm install"

[tasks."install/uv"]
run = "uv sync"

[tasks.build]
run = "cargo build"

[tasks.check]
run = "cargo check --all"

[tasks."check:watch"]
run = "bacon check-all"

[tasks.lint]
depends = [
  "lint/rust",
  # TODO: Add JS/Python linters
]

[tasks."lint:fix"]
depends = [
  "lint/rust:fix",
  # TODO: Add JS/Python linters
]

[tasks."lint:watch"]
depends = [
  "lint/rust:watch",
  # TODO: Add JS/Python linters
]

[tasks."lint/rust"]
run = "cargo clippy --all-targets --all-features"

[tasks."lint/rust:fix"]
run = "cargo clippy --all-targets --all-features --fix --allow-dirty"
depends_post = "format/rust"

[tasks."lint/rust:watch"]
run = "watchexec -e rs,Cargo.toml,Cargo.lock -rc reset -- cargo clippy --all-targets --all-features"

[tasks.format]
depends = [
  "format/base",
  "format/rust",
  # TODO: Add Python formatter
]

[tasks."format:check"]
depends = [
  "format/base:check",
  "format/rust:check",
  # TODO: Add Python formatter
]

[tasks."format/base"]
run = "pnpm exec oxfmt"

[tasks."format/base:check"]
run = "pnpm exec oxfmt --check"

[tasks."format/rust"]
run = "cargo fmt --all"

[tasks."format/rust:check"]
run = "cargo fmt --all --check"

[tasks.test]
run = ["test/unit", "test/system"]

[tasks."test/unit"]
depends = [
  "test/unit/rust",
  # TODO: Add JS/Python unit tests
]

[tasks."test/unit:watch"]
depends = [
  "test/unit/rust:watch",
  # TODO: Add JS/Python unit tests
]

[tasks."test/unit/rust"]
run = "cargo nextest run --no-fail-fast"

[tasks."test/unit/rust:watch"]
run = "watchexec -e rs,Cargo.toml,Cargo.lock -rc reset -- cargo nextest run --no-fail-fast"
# TODO: It's a nicer DX, but it gets stuck in "computing" state.
# run = "bacon test"

[tasks."test/system"]
depends = [
  "test/system/examples",
  # TODO: Add more system tests
]

[tasks."test/system/examples"]
run = "./scripts/test-examples.sh"

[tasks."types/ts"]
description = "Checks workspace TypeScript types"
run = "pnpm exec tsc --build"

[tasks."types/ts:watch"]
description = "Checks workspace TypeScript types in watch mode"
run = "pnpm exec tsc --build --watch"

[tasks.publish]
run = [{ task = "publish/cargo" }]

[tasks."publish/cargo"]
run = '''
cargo release publish \
  --exclude litty \
  --exclude litty_macro \
  --exclude litty_macro_tests \
  --exclude toml_ext \
  --exclude genotype_runtime \
  --exclude genotype_json_types \
  --workspace \
  --all-features \
  --no-verify \
  --no-confirm \
  --allow-branch '*' \
  --execute
'''

[tasks."publish/cargo:dry"]
run = '''
cargo release publish \
  --exclude litty \
  --exclude litty_macro \
  --exclude litty_macro_tests \
  --exclude toml_ext \
  --exclude genotype_runtime \
  --exclude genotype_json_types \
  --workspace \
  --all-features \
  --no-verify \
  --no-confirm \
  --allow-branch '*'
'''

[tasks."version/cargo"]
usage = '''
arg "<version>" help="Version to apply"
'''
run = '''
cargo release version {{usage.version}} \
  --workspace \
  --exclude litty \
  --exclude litty_macro \
  --exclude litty_macro_tests \
  --exclude toml_ext \
  --exclude genotype_runtime \
  --exclude genotype_json_types \
  --no-confirm \
  --execute
'''

[tasks."publish/cargo/litty"]
run = '''
cargo release publish \
  --package litty \
  --package litty_macro \
  --all-features \
  --no-verify \
  --no-confirm \
  --allow-branch '*' \
  --execute
'''

[tasks."publish/cargo/litty:dry"]
run = '''
cargo release publish \
  --package litty \
  --package litty_macro \
  --all-features \
  --no-verify \
  --no-confirm \
  --allow-branch '*'
'''

# changelog --------------------------------------------------------------------
[tasks.changelog]
run = '''
git-cliff --latest --strip all --tag-pattern '^v\d+\.\d+\.\d+'
'''
quiet = true
tools = { git-cliff = "latest" }

# dev/gt -----------------------------------------------------------------------
[tasks."dev/gt"]
description = "Runs the pinned development Genotype CLI"
usage = '''
arg "<args>" var=#true
'''
run = "./bin/gt {{usage.args | join(sep=' ')}}"

# dev/gt:watch -----------------------------------------------------------------
[tasks."dev/gt:watch"]
description = "Runs the pinned development Genotype CLI when type files change"
usage = '''
arg "<path>"
arg "<args>" var=#true
'''
run = "watchexec -w {{usage.path}} -e type -- ./bin/gt {{usage.args | join(sep=' ')}}"

# dev/gt:pin -------------------------------------------------------------------
[tasks."dev/gt:pin"]
description = "Builds and pins the development Genotype CLI"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cargo build --package genotype_cli --bin gt
mkdir -p ./bin
cp ./target/debug/gt ./bin/gt
'''

# Task templates ###############################################################

# Crate build ------------------------------------------------------------------
[task_templates."crate/build"]
usage = '''
arg "[target]"
flag "--dev" help="Builds dev version"
'''
run = '''
#!/usr/bin/env bash

crate_name="$CRATE_NAME"

if [ "${usage_dev:-false}" = "true" ]; then
  build_version=dev
else
  build_version=release
fi

echo -e "\n🚧 Building $build_version version of \`$crate_name\` crate\n"

if [ -z "${crate_name:-}" ]; then
  echo "🔴 CRATE_NAME env var must be set in the pkg's 'mise.toml'" >&2
  exit 1
fi

build_args=(--package $CRATE_NAME)

if [ -n "${usage_target:-}" ]; then
  build_args+=(--target "$usage_target")
fi

if [ "${usage_dev:-false}" = "false" ]; then
  build_args+=(--release)
fi

echo "🌀 Running \`cargo build\`:"
echo "........................................................................."
time cargo build "${build_args[@]}"
echo "........................................................................."
echo "🟢 Build completed"

echo -e "\n🎉 Successfully built $build_version version of \`$crate_name\` crate\n"
'''

# Crate build:dev --------------------------------------------------------------
[task_templates."crate/build:dev"]
run = [{ task = "build", args = ["--dev"] }]
