name: Save Cache
description: "Save caches for the development environment."

inputs:
  target-key:
    required: true
    description: "Key for caching target directory."

  enable-pnpm:
    required: false
    default: "false"
    description: "Whether to store pnpm cache."

  enable-uv:
    required: false
    default: "false"
    description: "Whether to store uv cache."

runs:
  using: "composite"

  steps:
    - name: Lookup mise State (Tasks) Cache
      id: lookup-mise
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/state/mise
        key: mise-state-${{ runner.os }}-${{ hashFiles('**/mise.toml') }}-${{ github.sha }}
        lookup-only: true

    - name: Save mise State (Tasks)
      if: ${{ steps.lookup-mise.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ~/.local/state/mise
        key: mise-state-${{ runner.os }}-${{ hashFiles('**/mise.toml') }}-${{ github.sha }}

    # - name: Lookup Rustup Cache
    #   id: lookup-rustup
    #   uses: actions/cache/restore@v5
    #   with:
    #     path: ~/.rustup/toolchains/
    #     key: rustup-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml') }}
    #     lookup-only: true

    # - name: Save Rustup Cache
    #   if: ${{ steps.lookup-rustup.outputs.cache-hit != 'true' }}
    #   uses: actions/cache/save@v5
    #   with:
    #     path: ~/.rustup/toolchains/
    #     key: rustup-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml') }}

    - name: Lookup Cargo Cache
      id: lookup-cargo
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        lookup-only: true

    - name: Save Cargo Cache
      if: ${{ steps.lookup-cargo.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

    # - name: Lookup Cargo Bins Cache
    #   id: lookup-cargo-bins
    #   uses: actions/cache/restore@v5
    #   with:
    #     path: |
    #       ~/.cargo/binstall/
    #       ~/.cargo/bin/
    #     key: cargo-bins-${{ runner.os }}
    #     lookup-only: true

    # - name: Save Cargo Bins Cache
    #   if: ${{ steps.lookup-cargo-bins.outputs.cache-hit != 'true' }}
    #   uses: actions/cache/save@v5
    #   with:
    #     path: |
    #       ~/.cargo/binstall/
    #       ~/.cargo/bin/
    #     key: cargo-bins-${{ runner.os }}

    - name: Save Target Cache
      uses: ./.github/actions/cache-save/target
      with:
        target-key: ${{ inputs.target-key }}

    - name: Get pnpm Store Path
      if: ${{ inputs.enable-pnpm == 'true' }}
      id: pnpm-store
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Lookup pnpm Cache
      if: ${{ inputs.enable-pnpm == 'true' }}
      id: lookup-pnpm
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        lookup-only: true

    - name: Save pnpm cache
      if: ${{ inputs.enable-pnpm == 'true' && steps.lookup-pnpm.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Lookup uv Cache
      if: ${{ inputs.enable-uv == 'true' }}
      id: lookup-uv
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
          .venv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        lookup-only: true

    - name: Save uv Cache
      if: ${{ inputs.enable-uv == 'true' && steps.lookup-uv.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
          .venv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
