name: Set Up Dev Env
description: "Set up development environment by installing dependencies and restoring caches."

inputs:
  target-key:
    required: true
    description: "Key for caching target directory."

  enable-pnpm:
    required: false
    default: "false"
    description: "Whether to install pnpm."

  enable-uv:
    required: false
    default: "false"
    description: "Whether to install uv."

runs:
  using: "composite"

  steps:
    - name: Install mise
      uses: jdx/mise-action@v4
      with:
        cache: false
        install: false

    - name: Restore mise Cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ hashFiles('**/mise.toml', '**/mise.lock') }}
        restore-keys: |
          mise-${{ runner.os }}-

    - name: Restore mise State (Tasks)
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/state/mise
        key: mise-state-${{ runner.os }}-${{ hashFiles('**/mise.toml') }}-${{ github.sha }}
        restore-keys: |
          mise-state-${{ runner.os }}-${{ hashFiles('**/mise.toml') }}-
          mise-state-${{ runner.os }}-

    # - name: Restore Rustup Cache
    #   uses: actions/cache/restore@v5
    #   with:
    #     path: ~/.rustup/toolchains/
    #     key: rustup-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml') }}
    #     restore-keys: |
    #       rustup-${{ runner.os }}-

    - name: Restore Cargo Cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    # - name: Restore Cargo Bins Cache
    #   uses: actions/cache/restore@v5
    #   with:
    #     path: |
    #       ~/.cargo/binstall/
    #       ~/.cargo/bin/
    #     key: cargo-bins-${{ runner.os }}

    - name: Install Tools
      run: |
        mise trust --yes
        mise install
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Set Up sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Set Rust sccache Env Vars
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

    - name: Set Rust Env Vars
      run: |
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV

    - name: Get pnpm Store Path
      if: ${{ inputs.enable-pnpm == 'true' }}
      id: pnpm-store
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Restore pnpm Cache
      if: ${{ inputs.enable-pnpm == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Install pnpm
      if: ${{ inputs.enable-pnpm == 'true' }}
      run: mise :install/pnpm
      shell: bash

    - name: Restore uv Cache
      if: ${{ inputs.enable-uv == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
          .venv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install uv
      if: ${{ inputs.enable-uv == 'true' }}
      run: mise :install/uv
      shell: bash
