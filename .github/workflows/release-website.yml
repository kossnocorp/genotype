name: Release Website

on:
  push:
    tags:
      - "website@[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      - "website@[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]+"

jobs:
  qa:
    name: Run QA
    uses: ./.github/workflows/qa.yml

  deploy:
    name: Deploy Website
    needs: qa
    runs-on: ubuntu-latest
    environment: release-website
    permissions:
      contents: read

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Dev Env
        uses: ./.github/actions/setup
        with:
          enable-node: true

      - name: Deploy Website
        run: mise //pkgs/app-website:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
