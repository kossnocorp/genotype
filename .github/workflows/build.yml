name: Build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_suffix:
        description: Suffix appended to uploaded artifact names. Defaults to `github.sha` if not provided.
        required: false
        type: string

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Linux --------------------------------------------------------------

          # x86
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu

          # ARM
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu

          # macOS --------------------------------------------------------------

          # x86
          - os: macos-26-intel
            target: x86_64-apple-darwin

          # ARM
          - os: macos-26
            target: aarch64-apple-darwin

          # Windows ------------------------------------------------------------

          # x86
          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # ARM
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set Up Dev Env
        uses: ./.github/actions/setup
        with:
          target-key: build-${{ matrix.target }}

      - name: Add Target
        run: rustup target add ${{ matrix.target }}

      - name: Build CLI
        run: mise //pkgs/crate-genotype-cli:build ${{ matrix.target }}

      - name: Build LSP
        run: mise //pkgs/crate-genotype-lsp:build ${{ matrix.target }}

      - name: Derive Bin Ext
        id: bin_ext
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            ext=".exe"
          fi
          echo "value=$ext" >> "$GITHUB_OUTPUT"

      - name: Save Target Cache
        uses: ./.github/actions/cache-save/target
        with:
          target-key: build-${{ matrix.target }}-${{ github.sha }}

      - name: Upload CLI Binaries
        uses: actions/upload-artifact@v6
        with:
          path: target/${{ matrix.target }}/release/gt${{ steps.bin_ext.outputs.value }}
          name: gt-${{ inputs.artifact_suffix || github.sha }}-${{ matrix.target }}${{ steps.bin_ext.outputs.value }}
          if-no-files-found: error

      - name: Upload LSP Binaries
        uses: actions/upload-artifact@v6
        with:
          path: target/${{ matrix.target }}/release/gts${{ steps.bin_ext.outputs.value }}
          name: gts-${{ inputs.artifact_suffix || github.sha }}-${{ matrix.target }}${{ steps.bin_ext.outputs.value }}
          if-no-files-found: error
