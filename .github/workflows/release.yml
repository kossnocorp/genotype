name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  qa:
    name: Run QA
    uses: ./.github/workflows/qa.yml
    with:
      build_artifact_suffix: ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Dev Env
        uses: ./.github/actions/setup

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-${{ github.ref_name }}-*"
          path: downloaded-artifacts

      - name: Collect Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          for artifact_dir in downloaded-artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name="$(basename "$artifact_dir")"
            for file in "$artifact_dir"/*; do
              [ -f "$file" ] || continue
              cp "$file" "release-assets/$artifact_name"
            done
          done

      - name: Attest Release Files
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$(mise //:changelog)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --notes "$notes" --verify-tag
          fi

      - name: Upload Release Files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            release-assets/* \
            "${{ steps.attest.outputs.bundle-path }}" \
            --clobber

      - name: Verify Binstall Package
        run: |
          cargo binstall \
            --manifest-path pkgs/crate-genotype-cli/Cargo.toml \
            --targets x86_64-unknown-linux-gnu \
            --strategies crate-meta-data \
            --dry-run \
            --no-confirm \
            genotype_cli

  publish-cargo:
    name: Publish Rust Crates
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      MISE_ENV_RELEASE: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set Up Dev Env
        uses: ./.github/actions/setup

      - name: Clean Up Git State
        shell: bash
        run: |
          git add .
          git stash

      - name: Publish Crates
        run: mise :publish/cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
